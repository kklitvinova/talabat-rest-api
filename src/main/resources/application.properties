server.port=8080
spring.jersey.application-path=/api
spring.application.name=jax-rs-order-service
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true
springdoc.packagesToScan=lt.viko.eif.klitvinova
springdoc.paths-to-match=/api/**
springdoc.use-management-port=false
springdoc.show-actuator=false
spring.mvc.pathmatch.use-suffix-pattern=false
spring.mvc.servlet.path=/
spring.datasource.url=jdbc:h2:mem:talabatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.sql.init.mode=always